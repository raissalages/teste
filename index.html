<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enviar Promoções</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white max-w-md w-full p-6 rounded-xl shadow-lg text-center">
    <h1 class="text-2xl font-bold text-blue-600 mb-4">Promoções por Perto</h1>
    <p class="text-gray-600 mb-4">Insira o número da pessoa que receberá as promoções:</p>

    <input type="text" id="numero" placeholder="Ex: 5511999999999"
           class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 mb-4" />

    <button onclick="gerarLink()" 
            class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition w-full">
      Gerar Link
    </button>

    <div id="linkContainer" class="mt-6 hidden">
      <p class="text-gray-700 mb-2">Envie este link para seu filho:</p>
      <a id="linkGerado" href="#" target="_blank"
         class="text-blue-600 underline break-words"></a>
    </div>
  </div>

  <script>
    function gerarLink() {
      const numero = document.getElementById("numero").value.trim();
      if (!numero) {
        alert("Por favor, insira um número.");
        return;
      }

      const repoName = 'promocoes-localizacao'; // substitua pelo nome do seu repositório no GitHub
      const url = `${window.location.origin}/${repoName}/promocoes.html?numero=${encodeURIComponent(numero)}`;
      
      document.getElementById("linkGerado").href = url;
      document.getElementById("linkGerado").textContent = url;
      document.getElementById("linkContainer").classList.remove("hidden");
    }
  </script>

</body>
</html>
